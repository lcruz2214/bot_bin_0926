version: "3.8"

services:
  # ==========================================
  # Aplicação Binance Quantitative Bot (Produção)
  # Conectada ao PostgreSQL Homelab (192.168.100.50)
  # ==========================================
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: binance-bot:latest
    container_name: binance_bot_app
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-bot_binance_super_secret_secure_key_2026}
      - POSTGRES_HOST=${POSTGRES_HOST:-192.168.100.50}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-postgresql}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${POSTGRES_HOST:-192.168.100.50}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-postgresql}
      - PAPER_TRADING=${PAPER_TRADING:-true}
      - INITIAL_BALANCE_USDT=${INITIAL_BALANCE_USDT:-10000.0}
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET:-}
      - BINANCE_TESTNET=${BINANCE_TESTNET:-false}
      - DEFAULT_SYMBOLS=${DEFAULT_SYMBOLS:-BTCUSDT,ETHUSDT,SOLUSDT,BNBUSDT}
      - DEFAULT_TIMEFRAME=${DEFAULT_TIMEFRAME:-1m}
      - HOST=0.0.0.0
      - PORT=5000
      - DEBUG=false
    volumes:
      - bot_data:/app/data

volumes:
  bot_data:
    driver: local
